version: '3.9'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: doctors_app_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: doctors-app
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - doctors_app_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet --authenticationDatabase admin -u ${MONGO_ROOT_USER:-admin} -p ${MONGO_ROOT_PASSWORD:-password}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doctors_app_backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/doctors-app?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - doctors_app_network
    # Healthcheck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (res) => { if (res.statusCode !== 200) throw new Error(res.statusCode) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Uncomment for production
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"

  # Mobile App (Expo Dev Server)
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: doctors_app_mobile
    restart: unless-stopped
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
    environment:
      EXPO_DEBUG: ${EXPO_DEBUG:-false}
      # Pass backend URL to mobile app
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://backend:8080/api}
    networks:
      - doctors_app_network
    depends_on:
      - backend
    # Remove this in production or replace with build command
    stdin_open: true
    tty: true
    # Uncomment if you want to run the Expo app in tunnel mode
    # environment:
    #   EXPO_TUNNEL: true

networks:
  doctors_app_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
